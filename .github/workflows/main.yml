# GitHub Action for generating a contribution graph with a snake eating your contributions.

name: Generate Snake

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"

  # Allows running the workflow manually from the Actions tab.
  workflow_dispatch:

  # Regenerate right away whenever the workflow itself changes.
  push:
    branches:
      - master
    paths:
      - .github/workflows/main.yml

permissions:
  contents: write

# Never run two generations at once (they would both push to "output").
concurrency:
  group: generate-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Generates the snake in light, dark and gif flavours.
      # snk v3 reads contributions through the GitHub API, so it needs a token.
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Publishes the files to the "output" branch, keeping master clean.
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
